apiVersion: v1
kind: Pod
metadata:
  name: mi-web20-dos
  labels:
    app: web20-dos
spec:
  containers:
    - name: contenedor-web-dos
      image: web20:v3
      imagePullPolicy: Never
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-web20-dos
spec:
  type: LoadBalancer
  selector:
    app: web20-dos
  ports:
    - port: 8086
      targetPort: 80